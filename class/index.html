<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二項分布プロッタ（クラスの結果を重ねる）</title>
<style>
  :root{
    --paper:#E9EDF2;
    --panel:#FCFDFE;
    --ink:#16233A;
    --ink-soft:#5A6B82;
    --rule:#C3CEDA;
    --bar:#2F5D8A;
    --bar-dim:#9FB6CC;
    --accent:#C8971B;
    --accent-deep:#8C6708;
    --curve:#B0453A;
    --obs:#3E8E7E;
    --obs-deep:#2C6357;
    --font-display:"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;
    --font-body:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.7;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:rgba(47,93,138,.15);
  }
  .wrap{max-width:980px;margin:0 auto;padding-block:24px 48px;padding-left:16px;padding-right:16px}

  /* ---- 見出し：式そのものを主役に ---- */
  header{margin-bottom:22px}
  h1{
    font-family:var(--font-display);
    font-size:19px;font-weight:400;letter-spacing:.16em;
    margin:0 0 12px;color:var(--ink-soft);
  }
  .formula{
    font-family:var(--font-display);
    font-size:clamp(20px,5.4vw,38px);
    line-height:1.4;
    letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    margin:0;
  }
  .formula sub{font-size:.52em;vertical-align:-.15em}
  .formula sup{font-size:.52em;vertical-align:.55em}
  .formula .live{color:var(--bar)}
  .formula .eq{color:var(--ink-soft)}
  .formula .rng{font-size:.5em;padding-left:1.2em;color:var(--ink-soft);white-space:nowrap}

  /* ---- 制御盤 ---- */
  .controls{
    background:var(--panel);
    border:1px solid var(--rule);
    padding:16px 16px 12px;
    margin-top:20px;
    display:flex;flex-direction:column;gap:14px;
  }
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .row .name{
    font-family:var(--font-display);font-size:19px;width:1.6em;flex:none;
  }
  input[type=range]{
    flex:1 1 200px;min-width:140px;accent-color:var(--bar);height:32px;
  }
  input[type=number]{
    width:5.6em;padding:7px;border:1px solid var(--rule);background:#fff;
    font-family:var(--font-body);font-size:16px;color:var(--ink);
    font-variant-numeric:tabular-nums;border-radius:0;
  }
  input[type=number]:focus-visible,input[type=range]:focus-visible,button:focus-visible{
    outline:2px solid var(--accent-deep);outline-offset:2px;
  }
  input[type=text]{
    flex:1 1 280px;min-width:180px;padding:7px;border:1px solid var(--rule);background:#fff;
    font-family:var(--font-body);font-size:16px;color:var(--ink);
    font-variant-numeric:tabular-nums;border-radius:0;
  }
  .obsgrid{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%;margin-top:-4px}
  .obsgrid label{display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:12px;color:var(--ink-soft)}
  .obsgrid input{width:3.6em;padding:6px 2px;border:1px solid var(--rule);background:#fff;
    font-size:16px;text-align:center;font-variant-numeric:tabular-nums;border-radius:0;color:var(--ink)}
  .obsrow{border-top:1px solid var(--rule);padding-top:12px}
  .obsrow .name{color:var(--obs-deep)}
  label.check input#obsChk{accent-color:var(--obs)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip,.seg button,.tools button{
    font-family:var(--font-body);font-size:14px;color:var(--ink);
    background:#fff;border:1px solid var(--rule);padding:8px 12px;cursor:pointer;
    border-radius:0;min-height:40px;
  }
  .chip:hover,.seg button:hover,.tools button:hover{background:#EDF2F7}
  .seg{display:flex}
  .seg button{border-right:none}
  .seg button:last-child{border-right:1px solid var(--rule)}
  .seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  label.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;min-height:40px}
  label.check input{accent-color:var(--bar);width:18px;height:18px}
  .sub{font-size:13px;color:var(--ink-soft)}
  .note{font-size:13px;color:var(--ink-soft);flex-basis:100%}

  /* ---- グラフ ---- */
  .plot{
    position:relative;margin-top:20px;border:1px solid var(--rule);
    background:
      repeating-linear-gradient(to right, transparent 0 23px, rgba(120,145,175,.10) 23px 24px),
      repeating-linear-gradient(to bottom, transparent 0 23px, rgba(120,145,175,.10) 23px 24px),
      var(--panel);
    touch-action:pan-y;
  }
  svg{display:block;width:100%;height:auto;max-width:100%}
  .tip{
    position:absolute;pointer-events:none;background:var(--ink);color:#fff;
    padding:6px 10px;font-size:13px;line-height:1.5;white-space:nowrap;
    transform:translate(-50%,-115%);opacity:0;transition:opacity .12s;
    font-variant-numeric:tabular-nums;
  }
  .tip.on{opacity:1}

  /* ---- 数値 ---- */
  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;background:var(--rule);border:1px solid var(--rule);margin:-1px 0 0;
  }
  .stats div{background:var(--panel);padding:10px 13px}
  .stats dt{font-size:12.5px;color:var(--ink-soft);margin:0}
  .stats dd{
    margin:2px 0 0;font-family:var(--font-display);font-size:20px;
    font-variant-numeric:tabular-nums;
  }
  .range-out{
    margin-top:16px;padding:13px 16px;border-left:4px solid var(--accent);
    background:var(--panel);border-top:1px solid var(--rule);
    border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  }
  .range-out b{font-family:var(--font-display);font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
  .tools{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
  th,td{border:1px solid var(--rule);padding:6px 9px;text-align:right;background:var(--panel)}
  th{background:#DFE6ED;font-weight:400;color:var(--ink-soft);position:sticky;top:0}
  .tablebox{max-height:340px;overflow:auto;margin-top:8px}
  [hidden]{display:none !important}
  footer{margin-top:28px;font-size:13px;color:var(--ink-soft)}
  @media (prefers-reduced-motion: reduce){
    .tip{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>二項分布</h1>
  <p class="formula" id="formula"></p>
</header>

<div class="controls">
  <div class="row">
    <span class="name">n</span>
    <input type="range" id="nRange" min="1" max="200" step="1" value="20" aria-label="試行回数 n">
    <input type="number" id="nNum" min="1" max="1000" step="1" value="20" aria-label="試行回数 n（直接入力）">
    <span class="sub">回</span>
  </div>
  <div class="row">
    <span class="name">p</span>
    <input type="range" id="pRange" min="0" max="1" step="0.005" value="0.5" aria-label="成功確率 p">
    <input type="number" id="pNum" min="0" max="1" step="0.001" value="0.5" aria-label="成功確率 p（直接入力）">
    <span class="chips">
      <button class="chip" data-p="0.5">1/2</button>
      <button class="chip" data-p="0.3333333333">1/3</button>
      <button class="chip" data-p="0.25">1/4</button>
      <button class="chip" data-p="0.1666666667">1/6</button>
      <button class="chip" data-p="0.1">0.1</button>
    </span>
  </div>
  <div class="row">
    <span class="seg" role="group" aria-label="グラフの形式">
      <button id="styleL" aria-pressed="true">折れ線</button>
      <button id="styleB" aria-pressed="false">棒</button>
    </span>
    <span class="seg" role="group" aria-label="表示の切り替え">
      <button id="modeP"  aria-pressed="true">確率 P<sub>r</sub></button>
      <button id="modeC"  aria-pressed="false">累積 P(X≦r)</button>
    </span>
    <label class="check"><input type="checkbox" id="normalChk">正規分布を重ねる</label>
    <label class="check"><input type="checkbox" id="meanChk" checked>平均の位置を示す</label>
  </div>
  <div class="row">
    <span class="sub">横軸の表示範囲</span>
    <span class="sub">r =</span>
    <input type="number" id="minNum" min="0" step="1" value="0" aria-label="横軸の左端">
    <span class="sub">〜</span>
    <input type="number" id="maxNum" min="0" step="1" value="20" aria-label="横軸の右端">
    <button class="chip" id="fitAll">0 から全体</button>
    <button class="chip" id="fitPeak">山に寄せる</button>
    <span class="note">左端が縦軸との交点になります</span>
  </div>
  <div class="row">
    <span class="sub">範囲の確率</span>
    <span class="sub">P(</span>
    <input type="number" id="aNum" min="0" step="1" value="0" aria-label="範囲の下端 a">
    <span class="sub">≦ X ≦</span>
    <input type="number" id="bNum" min="0" step="1" value="20" aria-label="範囲の上端 b">
    <span class="sub">)</span>
    <button class="chip" id="resetSel">全体に戻す</button>
    <span class="note">グラフを横になぞっても選べます</span>
  </div>
  <div class="row obsrow">
    <span class="name">実測</span>
    <input type="text" id="obsInput" inputmode="numeric"
      placeholder="0 から順に人数を（例　7 13 11 6 2 1）" aria-label="クラスの人数">
    <button class="chip" id="obsClear">消す</button>
    <button class="chip" id="obsPreset">n=10・p=1/6</button>
    <label class="check"><input type="checkbox" id="obsChk">クラスの結果を重ねる</label>
    <span class="note" id="obsNote"></span>
  </div>
  <div class="row obsgrid" id="obsGrid"></div>
</div>

<div class="plot" id="plot">
  <svg id="chart" viewBox="0 0 900 440" role="img" aria-label="二項分布のグラフ"></svg>
  <div class="tip" id="tip"></div>
</div>

<dl class="stats" id="stats"></dl>

<div class="range-out" id="rangeOut"></div>

<div class="tools">
  <button id="tableBtn" aria-expanded="false">数値表を開く</button>
</div>

<div class="tablebox" id="tablebox" hidden></div>

<footer>
  n と p を動かすと、式もグラフも変わります。グラフを横になぞると、その範囲の確率が出ます。<br>
  P<sub>r</sub> は小さくなると指数表記になります。n が大きいときは対数計算で桁落ちを避けています。<br>
  クラスの人数は<b>相対度数（人数÷合計）</b>に直して重ねます。縦軸は確率のままなので、そろえ直さずに比べられます。
</footer>

</div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const nRange=$("nRange"), nNum=$("nNum"), pRange=$("pRange"), pNum=$("pNum");
  const aNum=$("aNum"), bNum=$("bNum");
  const minNum=$("minNum"), maxNum=$("maxNum");
  const svg=$("chart"), tip=$("tip"), plot=$("plot");
  const NS="http://www.w3.org/2000/svg";

  let n=20, p=0.5, prob=null, cum=null;
  let mode="p";           // "p" | "c"
  let style="line";       // "line" | "bar"
  let selA=0, selB=20;
  let rMin=0, rMax=20;    // 横軸の表示範囲（rMin が縦軸との交点）
  let showNormal=false, showMean=true;

  /* 実測（クラスの人数） */
  const obsInput=$("obsInput"), obsGrid=$("obsGrid"), obsNote=$("obsNote");
  let obs=new Float64Array(n+1);   // obs[r] = r 問だった人数
  let showObs=false;

  function obsTotal(){ let s=0; for(let r=0;r<=n;r++) s+=obs[r]||0; return s; }
  function obsHas(){ return obsTotal()>0; }
  /* 表示中のモードに合わせた実測の高さ（確率＝相対度数／累積＝累積相対度数） */
  function obsSeries(){
    const t=obsTotal(); if(!t) return null;
    const a=new Float64Array(n+1);
    for(let r=0;r<=n;r++) a[r]=(obs[r]||0)/t;
    if(mode==="c"){ let s=0; for(let r=0;r<=n;r++){ s+=a[r]; a[r]=Math.min(s,1);} }
    return a;
  }
  function obsMoments(){
    const t=obsTotal(); if(!t) return null;
    let m=0; for(let r=0;r<=n;r++) m+=r*(obs[r]||0); m/=t;
    let v=0; for(let r=0;r<=n;r++) v+=(r-m)*(r-m)*(obs[r]||0); v/=t;
    return {t:t,m:m,v:v,s:Math.sqrt(v)};
  }
  function resizeObs(){
    const a=new Float64Array(n+1);
    for(let r=0;r<=Math.min(n,obs.length-1);r++) a[r]=obs[r];
    obs=a;
  }
  function parseObs(text){
    const nums=(text||"").split(/[^0-9]+/).filter(x=>x!=="").map(Number);
    obs=new Float64Array(n+1);
    for(let i=0;i<nums.length && i<=n;i++) obs[i]=nums[i];
    return nums.length;
  }
  function obsText(){
    let last=0; for(let r=0;r<=n;r++) if(obs[r]>0) last=r;
    const a=[]; for(let r=0;r<=last;r++) a.push(String(obs[r]||0));
    return a.join(" ");
  }
  function renderObsGrid(){
    if(n>20){ obsGrid.innerHTML=""; return; }
    let h="";
    for(let r=0;r<=n;r++)
      h+='<label>'+r+'<input type="number" min="0" step="1" data-r="'+r+
         '" value="'+(obs[r]||0)+'" aria-label="'+r+' 問だった人数"></label>';
    obsGrid.innerHTML=h;
    obsGrid.querySelectorAll("input").forEach(inp=>
      inp.addEventListener("change",()=>{
        obs[+inp.dataset.r]=Math.max(0,Math.round(+inp.value)||0);
        inp.value=obs[+inp.dataset.r];
        obsInput.value=obsText(); refreshObs();
      }));
  }
  function refreshObs(){
    const mo=obsMoments();
    if(!mo){ obsNote.textContent="人数を入れて、チェックを付けると重なります。"; }
    else{
      obsNote.innerHTML="合計 <b>"+mo.t+"人</b>　実測の平均 "+fmtN(mo.m,3)+
        "　実測の標準偏差 "+fmtN(mo.s,3)+"　／　理論 "+fmtN(n*p,3)+
        "，"+fmtN(Math.sqrt(n*p*(1-p)),3);
    }
    draw(); drawStats(); drawTable();
  }

  /* ---------- 計算 ---------- */
  function compute(){
    const lf=new Float64Array(n+1);
    for(let i=1;i<=n;i++) lf[i]=lf[i-1]+Math.log(i);
    prob=new Float64Array(n+1);
    if(p<=0){ prob[0]=1; }
    else if(p>=1){ prob[n]=1; }
    else{
      const lp=Math.log(p), lq=Math.log(1-p);
      for(let r=0;r<=n;r++) prob[r]=Math.exp(lf[n]-lf[r]-lf[n-r]+r*lp+(n-r)*lq);
    }
    cum=new Float64Array(n+1);
    let s=0;
    for(let r=0;r<=n;r++){ s+=prob[r]; cum[r]=Math.min(s,1); }
  }

  /* ---------- 書式 ---------- */
  function fmtP(v){
    if(v===0) return "0";
    if(v<1e-4) return v.toExponential(3).replace("e","×10^").replace("^-","^−");
    return v.toFixed(6).replace(/0+$/,"").replace(/\.$/,"");
  }
  function fmtN(v,d){ return Number(v.toFixed(d)).toString(); }
  function fmtFrac(){
    const q=[[0.5,"1/2"],[1/3,"1/3"],[0.25,"1/4"],[1/6,"1/6"],[2/3,"2/3"],[3/4,"3/4"],[5/6,"5/6"]];
    for(const [v,s] of q) if(Math.abs(p-v)<5e-4) return s;
    return fmtN(p,4);
  }

  /* ---------- 見出しの式 ---------- */
  function drawFormula(){
    const q = 1-p;
    $("formula").innerHTML =
      'P<sub>r</sub> <span class="eq">=</span> <sub class="live">'+n+'</sub>C<sub>r</sub> '+
      '<span class="live">'+fmtFrac()+'</span><sup>r</sup> '+
      '<span class="live">'+(Math.abs(q-0.5)<5e-4?"1/2":fmtN(q,4))+'</span><sup>'+n+'−r</sup>'+
      '<span class="rng">r = 0, 1, …, '+n+'</span>';
  }

  /* ---------- 目盛りの刻み ---------- */
  function niceStep(span, target){
    const raw=span/target, mag=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/mag;
    let m; if(f<=1)m=1; else if(f<=2)m=2; else if(f<=2.5)m=2.5; else if(f<=5)m=5; else m=10;
    return m*mag;
  }

  /* ---------- 画面の幅に合わせた作図の寸法 ---------- */
  let W=900,H=440,ML=78,MR=22,MT=26,MB=54,PW=800,PH=360;
  let FS=13, FSL=14, FSO=15, XT=9;   // 目盛り・ラベル・原点の文字、横目盛りの本数
  function layout(){
    const w = plot.clientWidth || 900;
    if(w<520){        W=470; H=430; ML=54; MR=14; MT=24; MB=50; FS=16; FSL=17; FSO=18; XT=5; }
    else if(w<760){   W=680; H=430; ML=66; MR=18; MT=24; MB=52; FS=14; FSL=15; FSO=16; XT=7; }
    else {            W=900; H=440; ML=78; MR=22; MT=26; MB=54; FS=13; FSL=14; FSO=15; XT=9; }
    PW=W-ML-MR; PH=H-MT-MB;
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
  }

  /* ---------- 描画 ---------- */
  let step=1;

  function el(tag,attrs,text){
    const e=document.createElementNS(NS,tag);
    for(const k in attrs) e.setAttribute(k,attrs[k]);
    if(text!=null) e.textContent=text;
    return e;
  }
  function draw(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    const data = (mode==="p") ? prob : cum;

    // --- 横軸の範囲（起点は rMin。ここで縦軸と交わる）---
    const span = Math.max(1, rMax-rMin);
    step = PW/span;
    const xC = r => ML+(r-rMin)*step;
    const PX = r => px[r-rMin], PY = r => py[r-rMin];

    // 表示している範囲だけで縦の目盛りを決める
    const obsS = (showObs && obsHas()) ? obsSeries() : null;

    let maxV = 1;
    if(mode==="p"){
      maxV=0;
      for(let r=rMin;r<=rMax;r++) if(data[r]>maxV) maxV=data[r];
      if(obsS) for(let r=rMin;r<=rMax;r++) if(obsS[r]>maxV) maxV=obsS[r];
    }
    if(maxV<=0) maxV=1;
    const yTop = (mode==="p") ? maxV*1.12 : 1.04;
    const y = v => MT+PH-(v/yTop)*PH;
    const base = MT+PH;

    const px=[], py=[];
    for(let r=rMin;r<=rMax;r++){ px.push(xC(r)); py.push(y(data[r])); }

    // y 軸グリッドと目盛り
    const ys=niceStep(yTop,5);
    for(let v=0; v<=yTop+1e-12; v+=ys){
      const yy=y(v);
      svg.appendChild(el("line",{x1:ML,x2:W-MR,y1:yy,y2:yy,stroke:"#C3CEDA","stroke-width":v===0?1.2:0.7}));
      if(v>0) svg.appendChild(el("text",{x:ML-8,y:yy+FS*0.35,"text-anchor":"end",fill:"#5A6B82",
        "font-size":FS}, Number(v.toPrecision(6)).toString()));
    }

    // --- 実測のヒストグラム（理論より先に描いて後ろに置く）---
    if(obsS){
      const wo = Math.min(step*0.86, 52);
      for(let r=rMin;r<=rMax;r++){
        const h = Math.max(base-y(obsS[r]), 0);
        if(h<=0.3) continue;
        svg.appendChild(el("rect",{
          x:xC(r)-wo/2, y:y(obsS[r]), width:Math.max(wo,0.8), height:h,
          fill:"#3E8E7E","fill-opacity":0.26, stroke:"#3E8E7E","stroke-width":1.1
        }));
      }
    }

    if(style==="bar"){
      const w = Math.min(step*0.68, 40);
      for(let r=rMin;r<=rMax;r++){
        const inSel = r>=selA && r<=selB;
        svg.appendChild(el("rect",{
          x:xC(r)-w/2, y:y(data[r]), width:Math.max(w,0.8), height:Math.max(base-y(data[r]),0),
          fill: inSel? "#2F5D8A" : "#9FB6CC"
        }));
      }
    }else{
      const pts = (a,b)=>{ let d=""; for(let r=a;r<=b;r++) d+=(r===a?"M":"L")+PX(r).toFixed(2)+" "+PY(r).toFixed(2)+" "; return d; };
      const sa=Math.max(selA,rMin), sb=Math.min(selB,rMax);
      if(sb>sa){
        let d="M"+PX(sa).toFixed(2)+" "+base;
        for(let r=sa;r<=sb;r++) d+="L"+PX(r).toFixed(2)+" "+PY(r).toFixed(2);
        d+="L"+PX(sb).toFixed(2)+" "+base+"Z";
        svg.appendChild(el("path",{d:d,fill:"#2F5D8A","fill-opacity":0.14,stroke:"none"}));
      }
      svg.appendChild(el("path",{d:pts(rMin,rMax),fill:"none",stroke:"#9FB6CC","stroke-width":2,
        "stroke-linejoin":"round","stroke-linecap":"round"}));
      if(sb>=sa) svg.appendChild(el("path",{d:pts(sa,sb),fill:"none",stroke:"#2F5D8A","stroke-width":2.6,
        "stroke-linejoin":"round","stroke-linecap":"round"}));
      const rad = Math.max(1.8, Math.min(4.2, step*0.26));
      if(step>=7){
        for(let r=rMin;r<=rMax;r++){
          const inSel = r>=selA && r<=selB;
          svg.appendChild(el("circle",{cx:PX(r),cy:PY(r),r:inSel?rad:rad*0.8,
            fill:inSel?"#2F5D8A":"#9FB6CC",stroke:"#FCFDFE","stroke-width":1}));
        }
      }
    }

    // 平均の縦線
    if(showMean && n*p>=rMin && n*p<=rMax){
      const mx=xC(n*p);
      const lab="m = np = "+fmtN(n*p,3);
      const right = mx > ML+PW*0.62;            // 右に寄ったら文字を左側に出す
      svg.appendChild(el("line",{x1:mx,x2:mx,y1:MT,y2:base,stroke:"#C8971B","stroke-width":1.6,"stroke-dasharray":"6 4"}));
      svg.appendChild(el("text",{x:right?mx-6:mx+6,y:MT+FS+2,fill:"#8C6708","font-size":FS,
        "text-anchor":right?"end":"start"},lab));
    }
    // 正規近似
    if(showNormal && mode==="p" && p>0 && p<1){
      const m=n*p, s=Math.sqrt(n*p*(1-p));
      if(s>0){
        let d="";
        for(let i=0;i<=300;i++){
          const t=rMin+span*i/300;
          const v=Math.exp(-((t-m)*(t-m))/(2*s*s))/(s*Math.sqrt(2*Math.PI));
          d+=(i?"L":"M")+xC(t).toFixed(2)+" "+y(v).toFixed(2)+" ";
        }
        svg.appendChild(el("path",{d:d,fill:"none",stroke:"#B0453A","stroke-width":2}));
        svg.appendChild(el("text",{x:W-MR-6,y:MT+FS*1.5,"text-anchor":"end",fill:"#B0453A","font-size":FS},
          "N("+fmtN(m,3)+", "+fmtN(s*s,3)+")"));
      }
    }

    // 実測の平均の縦線と凡例
    if(obsS){
      const mo=obsMoments();
      if(mo && mo.m>=rMin && mo.m<=rMax){
        const ox=xC(mo.m);
        const right = ox > ML+PW*0.62;
        svg.appendChild(el("line",{x1:ox,x2:ox,y1:MT,y2:base,stroke:"#2C6357",
          "stroke-width":1.6,"stroke-dasharray":"2 5"}));
        svg.appendChild(el("text",{x:right?ox-6:ox+6,y:base-8,fill:"#2C6357","font-size":FS,
          "text-anchor":right?"end":"start"},"実測の平均 = "+fmtN(mo.m,3)));
      }
      svg.appendChild(el("text",{x:W-MR-6,y:MT+FS*3.0,"text-anchor":"end",fill:"#2C6357",
        "font-size":FS},"クラスの結果（相対度数）"+obsTotal()+"人"));
    }

    // --- 軸（最後に描いて手前に置く）---
    svg.appendChild(el("line",{x1:ML,x2:W-MR,y1:base,y2:base,stroke:"#16233A","stroke-width":1.4}));
    svg.appendChild(el("line",{x1:ML,x2:ML,y1:MT,y2:base,stroke:"#16233A","stroke-width":1.4}));

    // 横軸の目盛り（起点 rMin は必ず打つ）
    const xs=Math.max(1,Math.round(niceStep(span,XT)));
    const ticks=[rMin];
    for(let r=Math.ceil((rMin+1)/xs)*xs; r<=rMax; r+=xs) if(r-rMin>xs*0.5) ticks.push(r);
    if(rMax-ticks[ticks.length-1] > xs*0.5) ticks.push(rMax);
    for(const r of ticks){
      svg.appendChild(el("line",{x1:xC(r),x2:xC(r),y1:base,y2:base+6,stroke:"#16233A","stroke-width":1}));
      if(r===rMin && rMin===0) continue;               // 原点は O で表す
      svg.appendChild(el("text",{x:xC(r),y:base+FS+10,"text-anchor":"middle",fill:"#16233A","font-size":FS},String(r)));
    }
    // 原点 O、または途中省略の印
    if(rMin===0){
      svg.appendChild(el("text",{x:ML-12,y:base+FSO+6,"text-anchor":"middle",fill:"#16233A","font-size":FSO,
        "font-style":"italic"},"O"));
    }else{
      svg.appendChild(el("path",{d:"M"+(ML+9)+" "+(base+7)+"l7 -14 M"+(ML+16)+" "+(base+7)+"l7 -14",
        stroke:"#16233A","stroke-width":1.3,fill:"none"}));
    }
    // 軸ラベル
    svg.appendChild(el("text",{x:W-MR,y:base+FSL+22,"text-anchor":"end",fill:"#5A6B82","font-size":FSL},"r"));
    svg.appendChild(el("text",{x:4,y:MT+FSL,fill:"#5A6B82","font-size":FSL},
      mode==="p" ? "Pr" : "P(X≦r)"));
  }

  /* ---------- 数値まわり ---------- */
  function drawStats(){
    const m=n*p, v=n*p*(1-p);
    let mode_r=0; for(let r=1;r<=n;r++) if(prob[r]>prob[mode_r]) mode_r=r;
    const items=[
      ["平均 E(X) = np", fmtN(m,4)],
      ["分散 V(X) = np(1−p)", fmtN(v,4)],
      ["標準偏差 σ", fmtN(Math.sqrt(v),4)],
      ["最大となる r", String(mode_r)],
      ["その確率 P"+mode_r, fmtP(prob[mode_r])]
    ];
    const mo=(showObs?obsMoments():null);
    if(mo){
      items.push(["実測の人数", String(mo.t)+" 人"]);
      items.push(["実測の平均", fmtN(mo.m,4)]);
      items.push(["実測の標準偏差", fmtN(mo.s,4)]);
    }
    $("stats").innerHTML = items.map(([k,val])=>
      "<div><dt>"+k+"</dt><dd>"+val+"</dd></div>").join("");

    let s=0; for(let r=selA;r<=selB;r++) s+=prob[r];
    let out = (selA===selB)
      ? "P<sub>"+selA+"</sub> = <b>"+fmtP(prob[selA])+"</b>　（P(X≦"+selA+") = "+fmtP(cum[selA])+"）"
      : "P("+selA+" ≦ X ≦ "+selB+") = <b>"+fmtP(s)+"</b>　（"+(selB-selA+1)+" 本ぶん）";
    if(showObs && obsHas()){
      const t=obsTotal();
      let c=0; for(let r=selA;r<=selB;r++) c+=obs[r]||0;
      out += "<br><span style=\"color:#2C6357\">この範囲の実測　<b>"+c+"人</b>／"+t+
             "人 = "+fmtN(c/t*100,1)+"%　　理論どおりなら "+fmtN(s*t,2)+" 人</span>";
    }
    $("rangeOut").innerHTML = out;
  }
  function drawTable(){
    if($("tablebox").hidden) return;
    const withObs = showObs && obsHas(), t=obsTotal();
    let h="<table><thead><tr><th>r</th><th>P<sub>r</sub></th><th>P(X≦r)</th>"+
      (withObs?"<th>実測の人数</th><th>相対度数</th><th>理論の人数</th>":"")+
      "</tr></thead><tbody>";
    for(let r=0;r<=n;r++){
      h+="<tr><td>"+r+"</td><td>"+fmtP(prob[r])+"</td><td>"+fmtP(cum[r])+"</td>";
      if(withObs) h+="<td>"+(obs[r]||0)+"</td><td>"+fmtN((obs[r]||0)/t,4)+
                     "</td><td>"+fmtN(prob[r]*t,2)+"</td>";
      h+="</tr>";
    }
    $("tablebox").innerHTML=h+"</tbody></table>";
  }

  function refresh(){
    compute();
    rMin=Math.max(0,Math.min(rMin,n-1)); rMax=Math.max(rMin+1,Math.min(rMax,n));
    if(n===1){ rMin=0; rMax=1; }
    selA=Math.max(0,Math.min(selA,n)); selB=Math.max(selA,Math.min(selB,n));
    aNum.max=n; bNum.max=n; aNum.value=selA; bNum.value=selB;
    minNum.max=n; maxNum.max=n; minNum.value=rMin; maxNum.value=rMax;
    drawFormula(); draw(); drawStats(); drawTable();
  }

  /* ---------- 入力 ---------- */
  function setN(v){ n=Math.max(1,Math.min(1000,Math.round(v)||1));
    nNum.value=n; nRange.value=Math.min(n,+nRange.max);
    rMin=0; rMax=n; selA=0; selB=n;
    resizeObs(); obsInput.value=obsText(); renderObsGrid();
    refresh(); refreshObs(); }
  function setP(v){ p=Math.max(0,Math.min(1,isNaN(v)?0.5:v));
    pNum.value=Number(p.toFixed(4)); pRange.value=p; refresh(); }

  nRange.addEventListener("input",e=>setN(+e.target.value));
  nNum.addEventListener("change",e=>setN(+e.target.value));
  pRange.addEventListener("input",e=>setP(+e.target.value));
  pNum.addEventListener("change",e=>setP(+e.target.value));
  document.querySelectorAll(".chip[data-p]").forEach(b=>
    b.addEventListener("click",()=>setP(+b.dataset.p)));
  aNum.addEventListener("change",()=>{ selA=Math.max(0,Math.min(+aNum.value,n)); if(selB<selA)selB=selA; refresh(); });
  bNum.addEventListener("change",()=>{ selB=Math.max(0,Math.min(+bNum.value,n)); if(selA>selB)selA=selB; refresh(); });
  $("resetSel").addEventListener("click",()=>{ selA=0; selB=n; refresh(); });

  minNum.addEventListener("change",()=>{ rMin=Math.max(0,Math.min(+minNum.value,n-1));
    if(rMax<=rMin) rMax=Math.min(n,rMin+1); refresh(); });
  maxNum.addEventListener("change",()=>{ rMax=Math.max(1,Math.min(+maxNum.value,n));
    if(rMin>=rMax) rMin=Math.max(0,rMax-1); refresh(); });
  $("fitAll").addEventListener("click",()=>{ rMin=0; rMax=n; refresh(); });
  $("fitPeak").addEventListener("click",()=>{
    const m=n*p, s=Math.sqrt(n*p*(1-p));
    let a=Math.floor(m-4*s), b=Math.ceil(m+4*s);
    if(!(b>a)){ a=Math.max(0,Math.round(m)-3); b=a+6; }
    rMin=Math.max(0,a); rMax=Math.min(n,b);
    if(rMax-rMin<2){ rMin=Math.max(0,rMax-2); }
    refresh();
  });

  $("styleL").addEventListener("click",()=>{ style="line";
    $("styleL").setAttribute("aria-pressed","true"); $("styleB").setAttribute("aria-pressed","false"); draw(); });
  $("styleB").addEventListener("click",()=>{ style="bar";
    $("styleB").setAttribute("aria-pressed","true"); $("styleL").setAttribute("aria-pressed","false"); draw(); });

  $("modeP").addEventListener("click",()=>{ mode="p";
    $("modeP").setAttribute("aria-pressed","true"); $("modeC").setAttribute("aria-pressed","false"); draw(); });
  $("modeC").addEventListener("click",()=>{ mode="c";
    $("modeC").setAttribute("aria-pressed","true"); $("modeP").setAttribute("aria-pressed","false"); draw(); });
  obsInput.addEventListener("change",()=>{
    parseObs(obsInput.value); obsInput.value=obsText(); renderObsGrid();
    if(obsHas() && !showObs){ showObs=true; $("obsChk").checked=true; }
    refreshObs();
  });
  $("obsClear").addEventListener("click",()=>{
    obs=new Float64Array(n+1); obsInput.value=""; renderObsGrid(); refreshObs();
  });
  $("obsPreset").addEventListener("click",()=>{ setP(1/6); setN(10); });
  $("obsChk").addEventListener("change",e=>{ showObs=e.target.checked; refreshObs(); });
  $("normalChk").addEventListener("change",e=>{ showNormal=e.target.checked; draw(); });
  $("meanChk").addEventListener("change",e=>{ showMean=e.target.checked; draw(); });

  /* ---------- グラフ上の操作（指・マウス共通） ---------- */
  function rAt(ev){
    const box=svg.getBoundingClientRect();
    const x=(ev.clientX-box.left)*(W/box.width);
    return Math.max(rMin,Math.min(rMax,Math.round((x-ML)/step)+rMin));
  }
  let dragging=false, anchor=0;
  function showTip(r){
    const box=svg.getBoundingClientRect(), sc=box.width/W;
    const data=(mode==="p")?prob:cum;
    let maxV=1;
    if(mode==="p"){ maxV=0; for(let i=rMin;i<=rMax;i++) if(data[i]>maxV) maxV=data[i]; }
    if(maxV<=0) maxV=1;
    const yTop=(mode==="p")?maxV*1.12:1.04;
    tip.classList.add("on");
    tip.innerHTML="r = "+r+"　P<sub>"+r+"</sub> = "+fmtP(prob[r]);
    const w=tip.offsetWidth||80;
    const raw=(ML+(r-rMin)*step)*sc;
    tip.style.left=Math.max(w/2+4, Math.min(box.width-w/2-4, raw))+"px";
    tip.style.top =Math.max(26,(MT+PH-(data[r]/yTop)*PH)*sc)+"px";
  }
  plot.addEventListener("pointerdown",ev=>{
    dragging=true; anchor=rAt(ev); selA=selB=anchor;
    if(plot.setPointerCapture) plot.setPointerCapture(ev.pointerId);
    refresh(); showTip(anchor);
  });
  plot.addEventListener("pointermove",ev=>{
    const r=rAt(ev);
    if(dragging){ selA=Math.min(anchor,r); selB=Math.max(anchor,r); refresh(); showTip(r); }
    else if(ev.pointerType!=="touch"){ showTip(r); }
  });
  plot.addEventListener("pointerup",()=>{dragging=false;});
  plot.addEventListener("pointercancel",()=>{dragging=false;});
  plot.addEventListener("pointerleave",()=>{dragging=false; tip.classList.remove("on");});

  /* ---------- 数値表 ---------- */
  $("tableBtn").addEventListener("click",()=>{
    const box=$("tablebox"), open=box.hidden;
    box.hidden=!open; $("tableBtn").setAttribute("aria-expanded",String(open));
    $("tableBtn").textContent = open ? "数値表を閉じる" : "数値表を開く";
    drawTable();
  });

  /* ---------- 画面の幅が変わったとき ---------- */
  let tId=0, lastW=0;
  addEventListener("resize",()=>{
    clearTimeout(tId);
    tId=setTimeout(()=>{
      const w=plot.clientWidth;
      if(w===lastW) return;
      lastW=w; layout(); draw();
    },120);
  });

  layout(); lastW=plot.clientWidth; refresh();
  renderObsGrid(); refreshObs();
})();
</script>

</body>
</html>
